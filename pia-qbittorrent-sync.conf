# Configuration file for PIA qBittorrent Sync Service
# This file should be placed at /etc/conf.d/pia-qbittorrent-sync

# PIA Account Configuration
# Required unless a readable token file already exists at PIA_TOKEN_FILE.
PIA_USERNAME="your_pia_username"
PIA_PASSWORD="your_pia_password"

# PIA VPN Configuration
# PIA_GATEWAY / PIA_HOSTNAME are rewritten by the service when it fails over to another
# server (it edits this file, see PIA_CONFIG_FILE), so keep them as plain KEY="value" lines.
PIA_GATEWAY="10.0.0.1"  # WireGuard endpoint IP of the current server
PIA_HOSTNAME="your_server_hostname"  # e.g., mexico409
PIA_CONFIG_FILE="/etc/conf.d/pia-qbittorrent-sync"
PIA_WG_CONFIG="/etc/wireguard/wg0.conf"  # wg-quick config rewritten on failover
PIA_CA_CERT="/path/to/ca.rsa.4096.crt"  # Path to PIA CA certificate (required)
PIA_TOKEN_FILE="/run/pia/token"

# qBittorrent Configuration
QBITTORRENT_HOST="http://localhost:8080"
# WARNING: Replace CHANGE_ME with your actual qBittorrent credentials before starting the service.
# The service will refuse to start if the password is blank, CHANGE_ME or another known default.
QBITTORRENT_USERNAME="CHANGE_ME"
QBITTORRENT_PASSWORD="CHANGE_ME"

# Service Configuration
CHECK_INTERVAL="300"  # Port refresh check interval in seconds (default: 5 minutes)
FAILOVER_TIMEOUT="300"  # Seconds without the PIA gateway before switching server (0 = off)
RETRY_INTERVAL="30"  # Retry interval after a failed check, in seconds
LOG_LEVEL="INFO"  # Logging level: DEBUG, INFO, WARNING, ERROR, CRITICAL
LOG_FILE="/var/log/pia_qbittorrent_sync.log"

# Export variables for the service
export PIA_USERNAME
export PIA_PASSWORD
export PIA_GATEWAY
export PIA_HOSTNAME
export PIA_CA_CERT
export PIA_TOKEN_FILE
export PIA_CONFIG_FILE
export PIA_WG_CONFIG
export FAILOVER_TIMEOUT
export RETRY_INTERVAL
export QBITTORRENT_HOST
export QBITTORRENT_USERNAME
export QBITTORRENT_PASSWORD
export CHECK_INTERVAL
export LOG_LEVEL
export LOG_FILE
